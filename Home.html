<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="Home.css" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


</head>

<body>
    <div id="root">

    </div>
    <script type="text/babel">
        function CreateCard(props) {
            //JSX code to create a card
            return <div class="card">
                <img src={props.imageUrl} width="100%" height="250" />
                <h3>{props.title}</h3>
                <p>A highly motivated and results-oriented professional with expertise in technology.</p>
                <button>Profile Details</button>
            </div>
        }


        function Header() {
            return <div class="header flexContainer">
                <h2>Header Component</h2>
            </div>

        }

        function Main() {
            return (
                <div class="main cardContainer">
                    <CreateCard title="Wilson Mat" imageUrl="https://tse1.mm.bing.net/th/id/OIP.4Sf5Qzlwrq-0iNoydcGW0wHaLH?rs=1&pid=ImgDetMain&o=7&rm=3"/>
                    <CreateCard title="Akshay Thakur" imageUrl="https://th.bing.com/th/id/OIP.kbEd8h7UvunAjPndOswJ6wHaLc?w=193&h=298&c=7&r=0&o=7&pid=1.7&rm=3"/>
                    <CreateCard title="Abdul Azim" imageUrl="https://th.bing.com/th/id/OIP.IzAWLJksWBM_kfLjF7hUFgHaLH?w=193&h=290&c=7&r=0&o=7&pid=1.7&rm=3"/>
                    <CreateCard title="Shubhendu" imageUrl="https://i.pinimg.com/originals/97/31/02/9731022f0be7c965e880505461643850.jpg"/>

                </div>
            );
        }

        function Footer() {
            return (
                <div class="footer flexContainer">
                    <h2>Footer Component</h2>
                </div>
            );
        }

        function App() {
            return (
                <div>
                    <Header />
                    <Main />
                    <Footer />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));

    </script>
</body>

</html>
