<!DOCTYPE html>
<html>
    <head>
        <title>JS Botton</title>
    </head>
    <body>
        <h2>Java Script Button</h2>
        <script>
            //code to create a button
            var buttonDomCreated=document.createElement('button');

            buttonDomCreated.innerText="Java Script Button";
            //<button>Java Script Button</button>

            //add the button in dom
            document.querySelector("body").appendChild(buttonDomCreated);
        </script>

    </body>
</html>
