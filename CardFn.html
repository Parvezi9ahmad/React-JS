<!DOCTYPE html>
<html>

<head>
    <style>
        .card {
            box-shadow: 0 0 10px green;
            padding: 10px;
            width: 270px;
            height: 400px;
        }
        #cardContainer{
            display: flex;
            justify-content: space-evenly;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


</head>

<body>
    <div id="root">

    </div>
    <script type="text/babel">

        function createCard(name) {
            //JSX code to create a card
            var imageUrl = "https://tse1.mm.bing.net/th/id/OIP.4Sf5Qzlwrq-0iNoydcGW0wHaLH?rs=1&pid=ImgDetMain&o=7&rm=3";
            return <div class="card">
                <img src={imageUrl} width="100%" height="250" />
                <h3>{name}</h3>
                <p>A highly motivated and results-oriented professional with expertise in technology.</p>
                <button>Profile Details</button>
            </div>
        }

        function multipleCard() {
            return (<div id="cardContainer">
                {createCard("Wilson Mat")}
                {createCard("Akshay Thakur")}
                {createCard("Shubhendu")}
                {createCard("Abdul Azim")}

            </div>
        );
        }

        ReactDOM.render(multipleCard(), document.getElementById('root'));

    </script>
</body>

</html>
