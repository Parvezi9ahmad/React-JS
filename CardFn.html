<!DOCTYPE html>
<html>

<head>
    <style>
        .card {
            box-shadow: 0 0 10px green;
            padding: 10px;
            width: 270px;
            height: 400px;
        }
        #cardContainer{
            display: flex;
            justify-content: space-evenly;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


</head>

<body>
    <div id="root">

    </div>
    <script type="text/babel">

        function createCard(name,imageUrl) {
            //JSX code to create a card
            return <div class="card">
                <img src={imageUrl} width="100%" height="250" />
                <h3>{name}</h3>
                <p>A highly motivated and results-oriented professional with expertise in technology.</p>
                <button>Profile Details</button>
            </div>
        }

        function multipleCard() {
            return (<div id="cardContainer">
                {createCard("Wilson Mat","https://tse1.mm.bing.net/th/id/OIP.4Sf5Qzlwrq-0iNoydcGW0wHaLH?rs=1&pid=ImgDetMain&o=7&rm=3")}
                {createCard("Akshay Thakur","https://th.bing.com/th/id/OIP.kbEd8h7UvunAjPndOswJ6wHaLc?w=193&h=298&c=7&r=0&o=7&pid=1.7&rm=3")}
                {createCard("Shubhendu","https://th.bing.com/th/id/OIP.IzAWLJksWBM_kfLjF7hUFgHaLH?w=193&h=290&c=7&r=0&o=7&pid=1.7&rm=3")}
                {createCard("Abdul Azim","https://i.pinimg.com/originals/97/31/02/9731022f0be7c965e880505461643850.jpg")}

            </div>
        );
        }

        ReactDOM.render(multipleCard(), document.getElementById('root'));

    </script>
</body>

</html>
