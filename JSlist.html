<!DOCTYPE html>
<html>

<head>
    <title>List Using JS</title>
</head>

<body>
    <h2>List Using JavaScript</h2>
    <script>
         function createList(){
        
            var olDocument=document.createElement("ol");

            var liDocument1 = document.createElement("li");
            var liDocument2 = document.createElement("li");
            var liDocument3 = document.createElement("li");
            var liDocument4 = document.createElement("li");

            olDocument.appendChild(liDocument1);
            olDocument.appendChild(liDocument2);
            olDocument.appendChild(liDocument3);
            olDocument.appendChild(liDocument4);

            liDocument1.innerText="Apple";
            liDocument2.innerText="Samsung";
            liDocument3.innerText="Vivo";
            liDocument4.innerText="Realme";

            document.querySelector("body").appendChild(olDocument);

         }

       createList();
       createList();
       createList();
       createList();
    
    </script>
</body>

</html>
